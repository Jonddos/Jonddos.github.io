<!doctype html>
<!-- Plantilla de la imagen social (1200×630). Se renderiza con `npm run assets`. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-weight: 100 800;
        src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #060a13;
        color: #f3f5f9;
        font-family: 'Inter Variable', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(113 177 255 / 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgb(113 177 255 / 0.07) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 90% 80% at 70% 0%, #000 30%, transparent 85%);
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
      }
      .glow.blue { width: 900px; height: 520px; top: -260px; right: -120px; background: radial-gradient(closest-side, rgb(36 97 233 / 0.45), transparent); }
      .glow.violet { width: 600px; height: 420px; bottom: -260px; left: -160px; background: radial-gradient(closest-side, rgb(136 96 234 / 0.28), transparent); }

      .content {
        position: relative;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }

      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 56px; height: 56px; }
      .name { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
      .role { margin-top: 4px; font-family: 'JetBrains Mono Variable', monospace; font-size: 17px; color: #8b92a1; }

      h1 {
        margin-top: auto;
        max-width: 940px;
        font-size: 66px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 span {
        background: linear-gradient(120deg, #86cdff, #629dff 45%, #9c95fe);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .footer {
        margin-top: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'JetBrains Mono Variable', monospace;
      }
      .chips { display: flex; gap: 10px; }
      .chip {
        padding: 8px 14px;
        border: 1px solid #242b3b;
        border-radius: 8px;
        background: #0c111d;
        color: #afb6c3;
        font-size: 17px;
      }
      .url { font-size: 19px; color: #71b1ff; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow blue"></div>
    <div class="glow violet"></div>

    <main class="content">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2f7bef" />
              <stop offset="1" stop-color="#8860ea" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#g)" />
          <path d="M18 8.5v9.5a5 5 0 0 1-10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          <rect x="21" y="19.5" width="3.5" height="5" rx="1" fill="#fff" fill-opacity=".85" />
        </svg>
        <div>
          <p class="name">Jonathan Ortiz</p>
          <p class="role">Full-stack Developer · UtiqAi</p>
        </div>
      </div>

      <h1>Construyo software que ayuda a negocios a <span>vender, automatizar y crecer.</span></h1>

      <div class="footer">
        <div class="chips">
          <span class="chip">SaaS</span>
          <span class="chip">Dashboards</span>
          <span class="chip">IA aplicada</span>
          <span class="chip">MVPs</span>
        </div>
        <span class="url">jonddos.github.io</span>
      </div>
    </main>
  </body>
</html>
