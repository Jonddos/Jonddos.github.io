<!doctype html>
<!--
  Plantilla de iconos PWA / Apple. Fondo a sangre y glifo dentro de la zona segura (80 %),
  válido como icono normal y como `maskable`. El tamaño lo marca la ventana del navegador.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2f7bef, #8860ea);
      }
      svg { width: 62vmin; height: 62vmin; }
    </style>
  </head>
  <body>
    <svg viewBox="6 6.5 20 20" aria-hidden="true">
      <path d="M18 8.5v9.5a5 5 0 0 1-10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      <rect x="21" y="19.5" width="3.5" height="5" rx="1" fill="#fff" fill-opacity=".85" />
    </svg>
  </body>
</html>
